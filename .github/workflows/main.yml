name: Build example

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Java ♨️
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Build 🔧
        run: |
          lsb_release -a

          # Download the latest stable Bob.
          BOB_SHA1=$(curl -s 'https://d.defold.com/stable/info.json' | jq -r .sha1)
          BOB_LOCAL_SHA1=$(java -jar bob.jar --version 2>/dev/null | cut -d' ' -f6 || true)
          if [ "${BOB_LOCAL_SHA1}" != "${BOB_SHA1}" ]; then wget --progress=dot:mega -O bob.jar "https://d.defold.com/archive/${BOB_SHA1}/bob/bob.jar"; fi
          java -jar bob.jar --version

          # Build the project
          bash ./dev_build_web.sh

          # Preserve the published Defold 1.6.2 demo. The current Extender no
          # longer builds native extensions for that historical engine SHA.
          git fetch origin gh-pages
          git archive origin/gh-pages old-version | tar -x -C public

          find "public/" | sort -z

      - name: Deploy to Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
        if: github.ref == 'refs/heads/main'
